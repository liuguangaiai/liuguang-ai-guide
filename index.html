  <script>
    (function () {
      var PAGE_SIZE = 12;
      var sections = [];
      try {
        sections = JSON.parse(document.getElementById("site-data").textContent || "[]");
      } catch (e) {
        sections = [];
      }
      if (!sections.length) return;

      var state = { section: 0, page: 1 };
      var tabsEl = document.getElementById("tabs");
      var listEl = document.getElementById("list");
      var infoEl = document.getElementById("page-info");
      var prevBtn = document.getElementById("prev-btn");
      var nextBtn = document.getElementById("next-btn");

      function renderTabs() {
        tabsEl.innerHTML = sections
          .map(function (sec, i) {
            var active = i === state.section ? " active" : "";
            return (
              '<button type="button" class="tab' +
              active +
              '" data-i="' +
              i +
              '">' +
              sec.title +
              "（" +
              (sec.pages || []).length +
              "）</button>"
            );
          })
          .join("");
      }

      function totalPages(sec) {
        var n = (sec.pages || []).length;
        return Math.max(1, Math.ceil(n / PAGE_SIZE));
      }

      function renderList() {
        var sec = sections[state.section];
        var pages = sec.pages || [];
        var tp = totalPages(sec);
        if (state.page > tp) state.page = tp;
        if (state.page < 1) state.page = 1;
        var start = (state.page - 1) * PAGE_SIZE;
        var slice = pages.slice(start, start + PAGE_SIZE);
        listEl.innerHTML = slice
          .map(function (p) {
            var desc = p.description
              ? "<span>" + escapeHtml(p.description) + "</span>"
              : "";
            return (
              '<a class="item" href="./' +
              encodeURIComponent(p.slug) +
              '.html"><strong>' +
              escapeHtml(p.title || p.slug) +
              "</strong>" +
              desc +
              "</a>"
            );
          })
          .join("");
        infoEl.textContent =
          sec.title +
          " · 第 " +
          state.page +
          " / " +
          tp +
          " 页 · 共 " +
          pages.length +
          " 篇";
        prevBtn.disabled = state.page <= 1;
        nextBtn.disabled = state.page >= tp;
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      tabsEl.addEventListener("click", function (e) {
        var btn = e.target.closest(".tab");
        if (!btn) return;
        state.section = Number(btn.getAttribute("data-i") || 0);
        state.page = 1;
        renderTabs();
        renderList();
      });
      prevBtn.addEventListener("click", function () {
        state.page -= 1;
        renderList();
      });
      nextBtn.addEventListener("click", function () {
        state.page += 1;
        renderList();
      });

      renderTabs();
      renderList();
    })();
  </script>
